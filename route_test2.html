
    <div style="font-family:sans-serif;">
      
      <div style="font-size:12px;color:#aaa;margin-bottom:6px;">
        Thứ tự theo giờ quay THỰC TẾ đã thiết lập cho từng camera — màu điểm theo độ tin cậy
        (xanh lá: cao, vàng: trung bình, cam: thấp). Đây là gợi ý thứ tự khả dĩ,
        KHÔNG PHẢI kết luận lộ trình chắc chắn — điều tra viên tự xác minh.
      </div>
      <div id="aia_route_map" style="height:440px;border-radius:6px;"></div>
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      <script>
      (function() {
        var initMap = function() {
          var el = document.getElementById("aia_route_map");
          if (!el || el._aia_map_done) return;
          el._aia_map_done = true;
          var map = L.map(el).setView([37.018450650000005, 127.10378395000001], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
          }).addTo(map);
          var markers = [{"lat": 36.9924966, "lng": 127.1127168, "color": "#4caf50", "label": "#1 \ud3c9\ud0dd\uc2dc", "popup": "<b>#1 \ud3c9\ud0dd\uc2dc</b><br>Camera: cam2<br>Gi\u1edd: 2026-08-06 09:00:02<br>\u0110i\u1ec3m kh\u1edbp: 0.78"}, {"lat": 37.0444047, "lng": 127.0948511, "color": "#ffc107", "label": "#2 \ud3c9\ud0dd\uc2dc \uc1a1\ud0c4\ub3d9", "popup": "<b>#2 \ud3c9\ud0dd\uc2dc \uc1a1\ud0c4\ub3d9</b><br>Camera: cam4<br>Gi\u1edd: 2026-08-06 09:30:10<br>\u0110i\u1ec3m kh\u1edbp: 0.60"}];
          var line = [[36.9924966, 127.1127168], [37.0444047, 127.0948511]];
          markers.forEach(function(m) {
            L.circleMarker([m.lat, m.lng], {
              radius: 9, color: '#fff', weight: 2, fillColor: m.color, fillOpacity: 0.9,
            }).addTo(map).bindPopup(m.popup);
          });
          if (line.length > 1) {
            L.polyline(line, {color: '#888', weight: 2, dashArray: '6,6'}).addTo(map);
          }
          var bounds = L.latLngBounds(line);
          map.fitBounds(bounds, {padding: [40, 40]});
        };
        if (window.L) { initMap(); } else {
          var s = document.querySelector('script[src*="leaflet.js"]');
          if (s) { s.addEventListener('load', initMap); }
          setTimeout(initMap, 400);
          setTimeout(initMap, 1200);
        }
      })();
      </script>
    </div>
